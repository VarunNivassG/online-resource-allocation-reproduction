[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "olp-repro"
version = "0.1.0"
description = "Research reproduction of a wait-less hybrid LP re-solving and first-order OLP framework"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "pandas>=2.0",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
olp-repro = "olp_repro.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
